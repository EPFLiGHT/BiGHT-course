name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Release runs at ~15:05 Europe/Zurich on lecture Wednesdays, with a
    # redundant ~16:05 fallback to cover missed or delayed GitHub Actions
    # schedule deliveries (the build is idempotent).
    # CEST (Mar-Oct): 15:05 UTC+2 = 13:05 UTC; 16:05 = 14:05 UTC.
    # CET (Oct-Mar):  15:05 UTC+1 = 14:05 UTC; 16:05 = 15:05 UTC.
    - cron: "5 13 9,16,23,30 9 *"
    - cron: "5 13 7,14 10 *"
    - cron: "5 14 28 10 *"
    - cron: "5 14 4,11,18,25 11 *"
    - cron: "5 14 2,9,16 12 *"
    - cron: "5 14 9,16,23,30 9 *"
    - cron: "5 14 7,14 10 *"
    - cron: "5 15 28 10 *"
    - cron: "5 15 4,11,18,25 11 *"
    - cron: "5 15 2,9,16 12 *"
    # TEMPORARY verification cron (2026-09-09 13:20 UTC). Remove after
    # confirming that GitHub Actions is delivering schedule events again.
    - cron: "20 13 9 9 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
