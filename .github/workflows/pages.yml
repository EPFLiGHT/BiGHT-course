name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_time:
        description: Optional ISO timestamp (UTC) to build at a specific release point. Leave blank to build at the current time.
        required: false
        type: string
  schedule:
    # Unlock the week ~20 min before the 15:00 lecture on Wednesdays so the
    # content is live early even if the run is delayed. The site still displays
    # "Available after ... 15:00". Off-top-of-hour so the run is less likely to
    # be dropped under load. If this run is ever missed, use the "Deploy on
    # demand" instructions in the README (scripts/redeploy.sh).
    - cron: "40 14 * * 3"
      timezone: "Europe/Zurich"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Build site
        run: python build_site.py
        env:
          BIGHT_BUILD_TIME: ${{ inputs.build_time }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
