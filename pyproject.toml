[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bight-course"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
]

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.setuptools]
py-modules = ["build_site"]
